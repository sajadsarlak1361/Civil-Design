[package]
name = "e57-read"
version = "0.1.0"
edition = "2021"
publish = false
description = "Read ASTM E57 point coordinates for Civil Design. MIT e57 crate, no network."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
e57 = "=0.11.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
