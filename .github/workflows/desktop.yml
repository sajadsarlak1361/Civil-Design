name: Desktop

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate DWG samples with LibreDWG
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential python3
          git clone --depth 1 https://github.com/LibreDWG/libredwg.git /tmp/libredwg
          cd /tmp/libredwg
          ./autogen.sh
          ./configure --disable-bindings --disable-python
          make -j2 || test -x programs/dxf2dwg
          test -x programs/dxf2dwg
          cd "$GITHUB_WORKSPACE"
          node scripts/generate-dwg-samples.mjs
      - run: npm run build:single
      - run: npm run build:web
      - run: npm test
      - name: Upload single-file page
        uses: actions/upload-artifact@v4
        with:
          name: installers-civil-design
          if-no-files-found: error
          path: |
            dist-single/civil-design.html
            dist-web/index.html

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles deb,appimage
          - os: windows-latest
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: ${{ matrix.args }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  stage-assets:
    needs: [test, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Stage one file per installer
        run: python3 scripts/stage-release-assets.py installers release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          path: release-assets/*

  release:
    needs: stage-assets
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('desktop-{0}', github.sha) || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('Civil Design desktop {0}', github.sha) || format('Civil Design {0}', github.ref_name) }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            Civil Design desktop installers for this tag.

            Windows setup embeds the WebView2 offline installer, so the machine does not need a network to finish installing. The app then runs offline. The MSI and the NSIS setup are separate downloads. Each one carries its own copy of that installer.

            The Windows build is unsigned. SmartScreen may say "Windows protected your PC". Choose More info, then Run anyway.

            Linux packages are an AppImage and a .deb. The AppImage needs WebKitGTK 4.1, which the .deb declares as a dependency.

            civil-design.html is the offline single-file page. Open it in a browser. It does not need an installer.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('desktop-{0}', github.sha) || github.ref_name }}
        run: |
          python3 - << 'PY'
          import json, os, subprocess, time
          tag = os.environ["RELEASE_TAG"]
          last = None
          raw = ""
          for _ in range(6):
              try:
                  raw = subprocess.check_output(["gh", "release", "view", tag, "--json", "isDraft,url,assets"], text=True)
                  break
              except subprocess.CalledProcessError as err:
                  last = err
                  time.sleep(5)
          else:
              raise SystemExit(last)
          release = json.loads(raw)
          if release["isDraft"]:
              raise SystemExit("release is still a draft")
          names = [asset["name"] for asset in release["assets"]]
          print(release["url"])
          for asset in release["assets"]:
              print(f"{asset['size']:12d}  {asset['name']}")
              if asset["size"] >= 2 * 1024**3:
                  raise SystemExit(asset["name"] + " is at or above 2 GiB")
          required = (".msi", ".exe", ".deb", ".AppImage", "civil-design.html")
          missing = [token for token in required if token not in names and not any(name.lower().endswith(token.lower()) for name in names)]
          if missing:
              raise SystemExit("published release is missing: " + ", ".join(missing))
          PY
